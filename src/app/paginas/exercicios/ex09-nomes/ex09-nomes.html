<div class="pagina">
  <div class="card">
    <h2>Cadastro de nomes</h2>
    <div class="formulario">
      <input type="text" placeholder="Digite um nome" [(ngModel)]="nome" (keyup.enter)="adicionar()">
      <button (click)="adicionar()">Adicionar</button>
    </div>
    <h3>Nomes cadastrados ({{ nomes.length }})</h3>
    <ul class="lista">
      @for (n of nomes; track $index) {
        <li>{{ n }}</li>
      }@empty {
        <p class="vazio">Nenhum nome cadastrado ainda.</p>
      }
    </ul>
  
  </div>
</div>
